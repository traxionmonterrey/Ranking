<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rendimiento | Traxión</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon-traxion.svg">
<style>
:root{
  --navy:#1a2236;--navy2:#222d42;--navy3:#2c3a55;
  --green:#7ed321;--lime:#D0DF00;--gold:#FBAE40;
  --white:#fff;--bg:#f0f2f7;--border:#dde3f0;
  --text:#1a2236;--muted:#6b7a99;--red:#e53e3e;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;min-height:100vh;}
nav{background:var(--navy);padding:10px 20px;display:flex;gap:12px;align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:300;flex-wrap:wrap;}
nav a{color:#e5e7eb;text-decoration:none;font-weight:600;padding:7px 14px;border-radius:8px;
      transition:all .3s;white-space:nowrap;font-size:14px;}
nav a.brand{color:#84cc16;font-weight:800;font-size:18px;}
nav a:hover{background:#374151;}

/* FILTER BAR */
.filter-bar{background:var(--white);border-bottom:1px solid var(--border);padding:.5rem 1.2rem;
            display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
            position:sticky;top:54px;z-index:200;box-shadow:0 1px 4px rgba(26,34,54,.05);}
.fg{display:flex;align-items:center;gap:.3rem;}
.fg label{font-size:.6rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
.fg select{background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);
           padding:.22rem .5rem;font-size:.71rem;font-family:"Inter",sans-serif;
           appearance:none;cursor:pointer;outline:none;max-width:160px;}
.fg select:focus{border-color:var(--green);}
.divider{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.btn-reset{background:none;border:1px solid var(--border);border-radius:5px;color:var(--muted);
           padding:.22rem .6rem;font-size:.68rem;font-family:"Inter",sans-serif;cursor:pointer;}
.btn-reset:hover{border-color:var(--red);color:var(--red);}

/* VIEW TOGGLE */
.view-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.view-toggle button{background:none;border:none;padding:.28rem .85rem;font-size:.71rem;font-weight:700;
                    color:var(--muted);cursor:pointer;font-family:"Inter",sans-serif;transition:all .15s;}
.view-toggle button.active{background:var(--navy);color:#fff;}

/* MAIN */
.main{padding:1rem 1.2rem;display:flex;flex-direction:column;gap:1rem;}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;}
.kpi{background:var(--white);border-radius:12px;padding:.95rem 1.05rem;position:relative;overflow:hidden;
     box-shadow:0 2px 10px rgba(26,34,54,.07);border-top:4px solid var(--kc,var(--green));}
.kpi::after{content:"";position:absolute;bottom:-14px;right:-14px;width:66px;height:66px;border-radius:50%;
            background:var(--kc,var(--green));opacity:.06;}
.kpi-icon{font-size:1rem;margin-bottom:.28rem;}
.kpi-val{font-size:1.65rem;font-weight:800;color:var(--kc,var(--green));line-height:1;letter-spacing:-.02em;}
.kpi-lbl{font-size:.63rem;font-weight:600;color:var(--muted);margin-top:.22rem;text-transform:uppercase;letter-spacing:.05em;}
.kpi-sub{font-size:.7rem;font-weight:600;color:var(--text);margin-top:.18rem;}

/* CARDS ROW */
.cards-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.card{background:var(--white);border-radius:12px;box-shadow:0 2px 10px rgba(26,34,54,.07);overflow:hidden;}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid var(--border);}
.card-hdr .ttl{font-size:.85rem;font-weight:700;}
.card-hdr .sub{font-size:.63rem;color:var(--muted);margin-top:.1rem;}
.badge{font-size:.68rem;color:var(--muted);background:var(--bg);border-radius:20px;padding:.15rem .5rem;}
.btn-exp{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:.28rem .7rem;
         font-size:.68rem;font-family:"Inter",sans-serif;font-weight:600;cursor:pointer;}
.btn-exp:hover{background:var(--navy3);}

/* TABLE */
.tbl-wrap{overflow-x:auto;max-height:360px;overflow-y:auto;}
.data-table{width:100%;border-collapse:collapse;}
.data-table thead th{background:var(--navy2);color:rgba(255,255,255,.85);font-size:.58rem;font-weight:600;
                     letter-spacing:.03em;text-transform:uppercase;padding:.35rem .55rem;text-align:left;
                     white-space:nowrap;position:sticky;top:0;z-index:5;}
.data-table thead th.r{text-align:right;}
.data-table thead th.sortable{cursor:pointer;}
.data-table thead th.sortable:hover{background:var(--navy3);}
.data-table thead th.col-rend{background:#1a2d1a;border-top:3px solid var(--green);}
.data-table tbody td{padding:.28rem .55rem;font-size:.71rem;border-bottom:1px solid var(--border);}
.data-table tbody td.r{text-align:right;}
.data-table tbody tr:hover{background:#f7f9ff;}
.data-table tbody tr:last-child td{border-bottom:none;}
.sc-null{color:var(--muted);}
.sa{font-size:.6rem;margin-left:.2rem;color:rgba(255,255,255,.35);}
th.sorted .sa{color:#84cc16;}

/* ALERT BADGE */
.badge-ok{display:inline-block;padding:.1rem .4rem;border-radius:4px;font-size:.62rem;font-weight:700;
          background:#dcfce7;color:#16a34a;}
.badge-warn{display:inline-block;padding:.1rem .4rem;border-radius:4px;font-size:.62rem;font-weight:700;
            background:#fef9c3;color:#a16207;}
.badge-bad{display:inline-block;padding:.1rem .4rem;border-radius:4px;font-size:.62rem;font-weight:700;
           background:#fee2e2;color:#dc2626;}

/* FULL-WIDTH TABLE CARD */
.full-card{background:var(--white);border-radius:12px;box-shadow:0 2px 10px rgba(26,34,54,.07);overflow:hidden;}
.tbl-full{max-height:420px;}

/* BANNER */
.sem-banner{background:var(--navy);color:#fff;border-radius:10px;padding:.7rem 1.1rem;
            display:flex;align-items:center;gap:.75rem;}
.sem-banner .sem-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;}
.sem-banner .sem-val{font-size:1.1rem;font-weight:800;color:#84cc16;}
.sem-banner .sem-sub{font-size:.68rem;color:#9ca3af;margin-left:auto;}

/* LOADING */
.ld-overlay{position:fixed;inset:0;background:rgba(240,242,247,.97);z-index:9999;
            display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;transition:opacity .4s;}
.ld-overlay.hidden{opacity:0;pointer-events:none;}
.ld-logo{font-size:1.9rem;font-weight:900;color:#7ed321;letter-spacing:4px;}
.ld-spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:#7ed321;
         border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-msg{font-size:.82rem;color:var(--muted);}
.err-bar{background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:.7rem 1rem;
         font-size:.78rem;color:#991b1b;display:none;margin-bottom:.3rem;}
.tbl-empty{text-align:center;padding:2rem;color:var(--muted);font-size:.8rem;}

/* BAR CHART */
.bar-wrap{padding:.75rem 1rem;display:flex;flex-direction:column;gap:.45rem;max-height:340px;overflow-y:auto;}
.bar-row{display:flex;align-items:center;gap:.5rem;}
.bar-label{font-size:.65rem;font-weight:600;color:var(--text);width:140px;flex-shrink:0;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:14px;background:#e5e7eb;border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;transition:width .4s;}
.bar-val{font-size:.65rem;font-weight:700;width:52px;text-align:right;flex-shrink:0;}

@media(max-width:768px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .cards-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<nav><a href="index.html" class="brand">TRAXIÓN</a></nav>

<div class="ld-overlay" id="ldOverlay">
  <div class="ld-logo">TRAXIÓN</div>
  <div class="ld-spin"></div>
  <div class="ld-msg" id="ldMsg">Cargando datos de rendimiento…</div>
</div>

<div class="filter-bar">
  <div class="view-toggle">
    <button id="btnSemanal" class="active" onclick="setView('semanal')">Semanal</button>
    <button id="btnMensual" onclick="setView('mensual')">Mensual</button>
  </div>
  <div class="divider"></div>
  <div class="fg"><label>UDN</label>
    <select id="f-udn" onchange="onFilter()"><option value="">Todas</option></select></div>
  <div class="fg"><label>Planta</label>
    <select id="f-plt" onchange="onFilter()"><option value="">Todas</option></select></div>
  <div class="fg"><label>Coordinador</label>
    <select id="f-coord" onchange="onFilter()"><option value="">Todos</option></select></div>
  <div class="fg"><label>Combustible</label>
    <select id="f-comb" onchange="onFilter()"><option value="">Todos</option></select></div>
  <div class="fg"><label>Mes</label>
    <select id="f-mes" onchange="onFilter()"><option value="">Todos</option></select></div>
  <div class="fg" id="semFg"><label>Semana</label>
    <select id="f-sem" onchange="onFilter()"></select></div>
  <div class="divider"></div>
  <button class="btn-reset" onclick="resetFilters()">↺ Limpiar</button>
</div>

<div class="main">
  <div class="err-bar" id="errBar"></div>

  <div class="sem-banner" id="semBanner" style="display:none">
    <div>
      <div class="sem-label">Período</div>
      <div class="sem-val" id="semVal">–</div>
    </div>
    <div class="sem-sub" id="semSub"></div>
  </div>

  <!-- Full unit table -->
  <div class="full-card">
    <div class="card-hdr">
      <div><div class="ttl">🚘 Detalle por Unidad</div>
      <div class="sub">Rendimiento real calculado: km recorridos ÷ litros cargados</div></div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <span class="badge" id="cntUnits">– unidades</span>
        <button class="btn-exp" onclick="exportExcel()">⬇ Excel</button>
      </div>
    </div>
    <div class="tbl-wrap tbl-full">
      <table class="data-table" id="tblUnits">
        <thead><tr>
          <th class="sortable" data-col="idVeh">ID Vehículo<span class="sa">↕</span></th>
          <th>Planta</th><th>Coordinador</th><th>UDN</th>
          <th class="r">Km Total</th><th class="r">Litros</th>
          <th class="r">Cargas</th>
          <th class="r sortable col-rend" data-col="rend">km/L Real<span class="sa">↕</span></th>
          <th class="r">Autorizado</th>
          <th class="r sortable" data-col="diff">Diferencia<span class="sa">↕</span></th>
          <th class="r">Combustible</th>
        </tr></thead>
        <tbody id="bodyUnits"><tr><td colspan="11" class="tbl-empty">Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SHEET_ID='122gJiwBww7fiKeLlotxx_fPR6-3lrtjC9csqGI9UU9A';
const SHEET_REND=encodeURIComponent('Rendimiento');
const SHEET_ASIG=encodeURIComponent('Asignacion');

let DATA_REND=[], DATA_ASIG=[], VIEW='semanal';
const SORT={col:'rend',dir:'desc'};

// ── PARSE ──
function parseLine(line){
  const cols=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(ch===','&&!inQ){cols.push(cur.trim());cur='';}
    else cur+=ch;
  }
  cols.push(cur.trim());return cols;
}
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return[];
  const hdrs=parseLine(lines[0]).map(h=>h.trim());
  const rows=[];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const cols=parseLine(lines[i]);
    const obj={};
    hdrs.forEach((h,idx)=>{obj[h]=cols[idx]!==undefined?cols[idx].trim():'';});
    rows.push(obj);
  }
  return rows;
}

// ── DATE UTILS ──
function parseDate(str){
  if(!str) return null;
  // Try DD/MM/YYYY, YYYY-MM-DD, MM/DD/YYYY
  let d=null;
  const s=str.trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) d=new Date(s);
  else if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)){
    const [a,b,c]=s.split('/');
    // Try DD/MM/YYYY first (common in MX)
    d=new Date(`${c}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`);
    if(isNaN(d)) d=new Date(`${c}-${a.padStart(2,'0')}-${b.padStart(2,'0')}`);
  }
  return d&&!isNaN(d)?d:null;
}
function getWeek(d){
  const jan1=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
}
function getMesNombre(d){
  return['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][d.getMonth()];
}

// ── BUILD LOOKUP ──
function buildAsigLookup(){
  const map={};
  DATA_ASIG.forEach(r=>{
    const id=String(r['ID VEH']||r['IdVehiculo']||'').trim();
    if(id) map[id]=r;
  });
  return map;
}

// ── ENRICH RENDIMIENTO ──
function enrichData(){
  const asig=buildAsigLookup();
  return DATA_REND.map(r=>{
    const d=parseDate(r['Fecha de Carga']);
    const idVeh=String(r['IdVehiculo']||r['ID VEH']||'').trim();
    const a=asig[idVeh]||{};
    // Try both possible column names for km and litros
    const kmRaw=r['Kilómetros Recorridos']||r['Kilómetros']||r['Kilometros Recorridos']||r['Kilometros']||'0';
    const ltRaw=r['Litros']||'0';
    const autRaw=r['Rendimiento Autorizado']||r['Rendimiento Aut']||'';
    const km=parseFloat(String(kmRaw).replace(',','.'))||0;
    const lt=parseFloat(String(ltRaw).replace(',','.'))||0;
    const autStr=String(autRaw).replace(',','.');
    const aut=parseFloat(autStr)||null;
    return{
      idVeh,
      fecha:d,
      semana:d?getWeek(d):null,
      mes:d?getMesNombre(d):null,
      km,lt,aut,
      comb:(r['Tipo de Combustible']||'').trim(),
      nomOp:(r['Nomina Operador']||'').trim(),
      nombrOp:(r['Nombre op.']||'').trim(),
      coord:(a['COORDINADOR']||'').trim(),
      jefe:(a['JEFE']||'').trim(),
      planta:(a['PLANTA']||'').trim(),
      udn:(a['Unidad de negocio']||'').trim(),
    };
  }).filter(r=>r.km>0&&r.lt>0);
}

let ENRICHED=[];

// ── SELECTS ──
function uniq(arr){return[...new Set(arr.filter(Boolean))].sort();}
function fillSel(id,vals,ph){
  const s=document.getElementById(id),cur=s.value;
  s.innerHTML=ph!==null?`<option value="">${ph}</option>`:'';
  vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});
  if(vals.includes(cur)) s.value=cur;
}
function buildSelects(){
  fillSel('f-udn',uniq(ENRICHED.map(r=>r.udn)),'Todas');
  fillSel('f-plt',uniq(ENRICHED.map(r=>r.planta)),'Todas');
  fillSel('f-coord',uniq(ENRICHED.map(r=>r.coord)),'Todos');
  fillSel('f-comb',uniq(ENRICHED.map(r=>r.comb)),'Todos');
  fillSel('f-mes',uniq(ENRICHED.map(r=>r.mes).filter(Boolean)),'Todos');
  fillSel('f-sem',uniq(ENRICHED.map(r=>r.semana).filter(v=>v!==null).map(String)),null);
}
function autoLatest(){
  const sems=uniq(ENRICHED.map(r=>r.semana).filter(v=>v!==null)).sort((a,b)=>b-a);
  if(!sems.length) return;
  const sel=document.getElementById('f-sem');
  for(let i=0;i<sel.options.length;i++){
    if(sel.options[i].value===String(sems[0])){sel.value=String(sems[0]);break;}
  }
}
function autoMes(){
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const act=meses[new Date().getMonth()];
  const sel=document.getElementById('f-mes');
  for(let i=0;i<sel.options.length;i++){if(sel.options[i].value===act){sel.value=act;break;}}
}

function setView(mode){
  VIEW=mode;
  document.getElementById('btnSemanal').classList.toggle('active',mode==='semanal');
  document.getElementById('btnMensual').classList.toggle('active',mode==='mensual');
  document.getElementById('semFg').style.display=mode==='semanal'?'flex':'none';
  if(mode==='mensual'&&!document.getElementById('f-mes').value) autoMes();
  if(mode==='semanal'&&!document.getElementById('f-sem').value) autoLatest();
  render();
}

function getFiltered(){
  const v=id=>document.getElementById(id).value;
  const udn=v('f-udn'),plt=v('f-plt'),coord=v('f-coord'),comb=v('f-comb'),mes=v('f-mes'),sem=v('f-sem');
  return ENRICHED.filter(r=>{
    if(udn&&r.udn!==udn) return false;
    if(plt&&r.planta!==plt) return false;
    if(coord&&r.coord!==coord) return false;
    if(comb&&r.comb!==comb) return false;
    if(mes&&r.mes!==mes) return false;
    if(VIEW==='semanal'&&sem&&String(r.semana)!==sem) return false;
    return true;
  });
}

function onFilter(){render();}
function resetFilters(){
  ['f-udn','f-plt','f-coord','f-comb','f-mes'].forEach(id=>document.getElementById(id).value='');
  if(VIEW==='semanal') autoLatest(); else autoMes();
  render();
}

// ── AGGREGATE BY UNIT ──
// Rendimiento = SUM(km) / SUM(litros) — NEVER average of rates
function aggregateUnits(rows){
  const map={};
  rows.forEach(r=>{
    const k=r.idVeh;
    if(!map[k]) map[k]={idVeh:k,coord:r.coord,planta:r.planta,udn:r.udn,
                         totalKm:0,totalLt:0,cargas:0,autVals:[],combs:new Set()};
    map[k].totalKm+=r.km;
    map[k].totalLt+=r.lt;
    map[k].cargas++;
    if(r.aut) map[k].autVals.push(r.aut);
    if(r.comb) map[k].combs.add(r.comb);
  });
  return Object.values(map).map(g=>{
    const rend=g.totalLt>0?g.totalKm/g.totalLt:null;
    const aut=g.autVals.length?g.autVals.reduce((a,b)=>a+b,0)/g.autVals.length:null;
    const diff=rend!==null&&aut!==null?rend-aut:null;
    return{...g,rend,aut,diff,comb:[...g.combs].join('/')};
  }).filter(g=>g.rend!==null);
}

// ── AGGREGATE BY COORDINATOR ──
function aggregateCoords(units){
  const map={};
  units.forEach(u=>{
    const k=u.coord||'Sin asignar';
    if(!map[k]) map[k]={coord:k,totalKm:0,totalLt:0,autVals:[]};
    map[k].totalKm+=u.totalKm;
    map[k].totalLt+=u.totalLt;
    if(u.aut) map[k].autVals.push(u.aut);
  });
  return Object.values(map).map(g=>{
    const rend=g.totalLt>0?g.totalKm/g.totalLt:null;
    const aut=g.autVals.length?g.autVals.reduce((a,b)=>a+b,0)/g.autVals.length:null;
    return{...g,rend,aut};
  }).filter(g=>g.rend!==null).sort((a,b)=>b.rend-a.rend);
}

// ── COLORS ──
function rendColor(rend,aut){
  if(aut===null) return '#60a5fa';
  if(rend>=aut) return '#22c55e';
  if(rend>=aut*0.95) return '#f59e0b';
  return '#ef4444';
}
function diffBadge(diff){
  if(diff===null) return '<span class="sc-null">–</span>';
  const sign=diff>=0?'+':'';
  const cls=diff>=0?'badge-ok':diff>=-0.2?'badge-warn':'badge-bad';
  return `<span class="${cls}">${sign}${diff.toFixed(2)}</span>`;
}
function rendCell(rend,aut){
  const c=rendColor(rend,aut);
  return `<span style="font-weight:700;color:${c}">${rend!==null?rend.toFixed(2):'–'}</span>`;
}

// ── BANNER ──
function updateBanner(){
  const sem=document.getElementById('f-sem').value;
  const mes=document.getElementById('f-mes').value;
  const banner=document.getElementById('semBanner');
  if(VIEW==='mensual'){
    banner.style.display='flex';
    document.getElementById('semVal').textContent=mes||'Todos los meses';
    document.getElementById('semSub').textContent='Vista mensual';
  } else if(sem){
    banner.style.display='flex';
    document.getElementById('semVal').textContent='Semana '+sem;
    document.getElementById('semSub').textContent=mes?'Mes: '+mes:'';
  } else banner.style.display='none';
}

// ── SORT ──
const SORT_STATE={col:'rend',dir:'desc'};
function sortUnits(units){
  return[...units].sort((a,b)=>{
    let va=a[SORT_STATE.col],vb=b[SORT_STATE.col];
    if(va===null||va===undefined) return 1;
    if(vb===null||vb===undefined) return -1;
    if(typeof va==='string') va=va.toLowerCase();
    if(typeof vb==='string') vb=vb.toLowerCase();
    if(va===vb) return 0;
    return SORT_STATE.dir==='desc'?(va>vb?-1:1):(va<vb?-1:1);
  });
}

// ── RENDER ──
function render(){
  updateBanner();
  const f=getFiltered();
  const units=aggregateUnits(f);

  // Full table
  renderUnitsTable(units);
}

function renderBarChart(coords){
  document.getElementById('cntCoord').textContent=coords.length+' coordinadores';
  const maxRend=Math.max(...coords.map(c=>c.rend||0),1);
  const wrap=document.getElementById('barCoord');
  if(!coords.length){wrap.innerHTML='<div class="tbl-empty">Sin datos</div>';return;}
  wrap.innerHTML=coords.map(c=>{
    const pct=((c.rend/maxRend)*100).toFixed(1);
    const col=rendColor(c.rend,c.aut);
    const autLine=c.aut?`<div style="position:absolute;top:0;left:${((c.aut/maxRend)*100).toFixed(1)}%;width:2px;height:100%;background:#374151;opacity:.5"></div>`:'';
    return`<div class="bar-row">
      <div class="bar-label" title="${c.coord}">${c.coord||'Sin asignar'}</div>
      <div class="bar-track" style="position:relative">
        <div class="bar-fill" style="width:${pct}%;background:${col}"></div>
        ${autLine}
      </div>
      <div class="bar-val" style="color:${col}">${c.rend.toFixed(2)}</div>
    </div>`;
  }).join('');
}

function renderTopBot(units){
  const sorted=[...units].filter(u=>u.rend!==null).sort((a,b)=>b.rend-a.rend);
  const top5=sorted.slice(0,5);
  const bot5=[...sorted].reverse().slice(0,5);
  const body=document.getElementById('bodyTopBot');
  if(!sorted.length){body.innerHTML='<tr><td colspan="6" class="tbl-empty">Sin datos</td></tr>';return;}
  const rows=[
    ...top5.map((u,i)=>`<tr>
      <td><span style="font-weight:700;color:#22c55e">▲${i+1}</span></td>
      <td style="font-weight:600">${u.idVeh}</td>
      <td style="color:var(--muted);font-size:.65rem">${u.coord||'–'}</td>
      <td class="r">${rendCell(u.rend,u.aut)}</td>
      <td class="r" style="color:var(--muted)">${u.aut!==null?u.aut.toFixed(2):'–'}</td>
      <td class="r">${diffBadge(u.diff)}</td>
    </tr>`),
    `<tr><td colspan="6" style="background:#f0f2f7;font-size:.6rem;font-weight:700;color:var(--muted);padding:.2rem .55rem;letter-spacing:.05em">— BOTTOM 5 —</td></tr>`,
    ...bot5.map((u,i)=>`<tr>
      <td><span style="font-weight:700;color:#ef4444">▼${i+1}</span></td>
      <td style="font-weight:600">${u.eco}</td>
      <td style="color:var(--muted);font-size:.65rem">${u.coord||'–'}</td>
      <td class="r">${rendCell(u.rend,u.aut)}</td>
      <td class="r" style="color:var(--muted)">${u.aut!==null?u.aut.toFixed(2):'–'}</td>
      <td class="r">${diffBadge(u.diff)}</td>
    </tr>`)
  ];
  body.innerHTML=rows.join('');
}

function renderUnitsTable(units){
  const tblEl=document.getElementById('tblUnits');
  const body=document.getElementById('bodyUnits');
  const sorted=sortUnits(units);
  tblEl.querySelectorAll('thead th').forEach(th=>{
    th.classList.remove('sorted');
    const sa=th.querySelector('.sa');if(sa) sa.textContent='↕';
  });
  const sTh=tblEl.querySelector(`thead th[data-col="${SORT_STATE.col}"]`);
  if(sTh){sTh.classList.add('sorted');const sa=sTh.querySelector('.sa');if(sa) sa.textContent=SORT_STATE.dir==='asc'?'↑':'↓';}
  document.getElementById('cntUnits').textContent=sorted.length+' unidades';
  if(!sorted.length){body.innerHTML='<tr><td colspan="11" class="tbl-empty">Sin datos para los filtros seleccionados</td></tr>';return;}
  body.innerHTML=sorted.map(u=>`<tr>
    <td style="font-weight:600">${u.eco}</td>
    <td style="color:var(--muted);font-size:.65rem">${u.planta||'–'}</td>
    <td style="font-size:.65rem">${u.coord||'–'}</td>
    <td style="color:var(--muted);font-size:.65rem">${u.udn||'–'}</td>
    <td class="r">${u.totalKm.toLocaleString('es-MX',{maximumFractionDigits:1})}</td>
    <td class="r">${u.totalLt.toLocaleString('es-MX',{maximumFractionDigits:1})}</td>
    <td class="r">${u.cargas}</td>
    <td class="r">${rendCell(u.rend,u.aut)}</td>
    <td class="r" style="color:var(--muted)">${u.aut!==null?u.aut.toFixed(2):'–'}</td>
    <td class="r">${diffBadge(u.diff)}</td>
    <td style="font-size:.65rem;color:var(--muted)">${u.comb||'–'}</td>
  </tr>`).join('');
}

// ── SORT CLICK ──
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.data-table thead th.sortable').forEach(th=>{
    th.addEventListener('click',()=>{
      const col=th.dataset.col;if(!col) return;
      if(SORT_STATE.col===col) SORT_STATE.dir=SORT_STATE.dir==='desc'?'asc':'desc';
      else{SORT_STATE.col=col;SORT_STATE.dir='desc';}
      renderUnitsTable(aggregateUnits(getFiltered()));
    });
  });
  loadData();
});

// ── EXPORT ──
function exportExcel(){
  const units=sortUnits(aggregateUnits(getFiltered()));
  const hdrs=['ID Vehículo','Planta','Coordinador','UDN','Km Total','Litros','Cargas','km/L Real','Autorizado','Diferencia','Combustible'];
  const fmt=v=>v===null?'':+v.toFixed(2);
  const data=units.map(u=>[u.idVeh,u.planta,u.coord,u.udn,
    +u.totalKm.toFixed(1),+u.totalLt.toFixed(1),u.cargas,
    fmt(u.rend),fmt(u.aut),fmt(u.diff),u.comb]);
  const ws=XLSX.utils.aoa_to_sheet([hdrs,...data]);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Rendimiento');
  XLSX.writeFile(wb,`rendimiento_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ── LOAD ──
async function loadData(){
  const ov=document.getElementById('ldOverlay');
  const msg=document.getElementById('ldMsg');
  const err=document.getElementById('errBar');
  try{
    msg.textContent='Cargando rendimiento…';
    const base=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
    const [r1,r2]=await Promise.all([
      fetch(`${base}&sheet=${SHEET_REND}`),
      fetch(`${base}&sheet=${SHEET_ASIG}`)
    ]);
    if(!r1.ok) throw new Error(`Rendimiento: HTTP ${r1.status}`);
    if(!r2.ok) throw new Error(`Asignacion: HTTP ${r2.status}`);
    msg.textContent='Procesando datos…';
    const [t1,t2]=await Promise.all([r1.text(),r2.text()]);
    DATA_REND=parseCSV(t1);
    DATA_ASIG=parseCSV(t2);
    if(!DATA_REND.length) throw new Error('Hoja Rendimiento vacía');
    // DEBUG: log first row keys of both sheets
    if(DATA_REND.length) console.log('REND keys:', Object.keys(DATA_REND[0]));
    if(DATA_ASIG.length) console.log('ASIG keys:', Object.keys(DATA_ASIG[0]));
    if(DATA_REND.length) console.log('REND row0:', DATA_REND[0]);
    if(DATA_ASIG.length) console.log('ASIG row0:', DATA_ASIG[0]);
    ENRICHED=enrichData();
    console.log('ENRICHED sample:', ENRICHED.slice(0,3));
    ov.classList.add('hidden');setTimeout(()=>ov.style.display='none',450);
    buildSelects();
    autoLatest();
    render();
  }catch(e){
    ov.classList.add('hidden');setTimeout(()=>ov.style.display='none',450);
    err.style.display='block';
    err.textContent='⚠️ Error al cargar: '+e.message+'. Verifica que el Sheet sea público y las hojas existan.';
  }
}
</script>
